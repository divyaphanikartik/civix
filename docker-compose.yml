services:

  postgres:
    image: postgres:16-alpine

    container_name: civix-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: civix
      POSTGRES_USER: civix
      POSTGRES_PASSWORD: civix

    ports:
      - "5431:5432"

    volumes:
      - civix_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U civix -d civix"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: civix-backend

    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql://civix:civix@postgres:5432/civix

      GEMINI_API_KEY: ${GEMINI_API_KEY}

      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_WHATSAPP_NUMBER: ${TWILIO_WHATSAPP_NUMBER}
      TWILIO_VALIDATE_WEBHOOK_SIGNATURE: ${TWILIO_VALIDATE_WEBHOOK_SIGNATURE:-false}

      FRONTEND_URL: http://localhost:5173

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - ./backend/app:/app/app


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: civix-frontend

    restart: unless-stopped

    ports:
      - "5173:5173"

    environment:
      VITE_API_URL: http://localhost:8000/api

    volumes:
      - ./frontend:/app
      - /app/node_modules

    depends_on:
      - backend


volumes:
  civix_postgres_data: